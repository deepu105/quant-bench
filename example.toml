path = "/models/Swift-1.5-Qwen3.8-Flash-Next-IQ3_XXS-00001-of-00003.gguf"

[models.unsloth-iq4_xs]
path = "/models/Qwen3.8-Flash-Next-UD-IQ4_XS-00001-of-00003.gguf"
